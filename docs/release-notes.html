<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KimiCodeBar 更新日志</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      line-height: 1.6;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .thanks {
      font-size: 14px;
      color: #8b949e;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: rgba(88, 166, 255, 0.08);
      border-radius: 8px;
      border: 1px solid rgba(88, 166, 255, 0.2);
    }
    .thanks a {
      color: #58a6ff;
      text-decoration: none;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      position: relative;
      padding-left: 18px;
      margin-bottom: 12px;
      font-size: 14px;
      color: #c9d1d9;
    }
    li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #58a6ff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <li>多账号新增 API Key 登录方式，添加账号时可选浏览器授权登录或 API Key 登录。</li> <li>面板与设置页 UI 重构：多账号配额卡片改为双列压缩布局，设置窗口隐形标题栏、支持按住空白拖动。</li> <li>新增 CLI 账号切换：一键将 OAuth 账号凭证写入 Kimi CLI，完成命令行登录切换。</li> <li>本机消耗量「今日」改为按小时蓝色波浪曲线，悬停可查看各时段 Token 消耗。</li> <li>Sparkle 自动更新的更新日志改为独立页面展示，内容与排版更清晰。</li> 
</body>
</html>
